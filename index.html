<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nezaket mi, Kabalık mı?</title>
  <!-- Çocuk dostu, yuvarlak hatlı ve Türkçe karakter destekli fontlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-display: 'Fredoka', 'Nunito', sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-display);
      background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 50%, #f0fdf4 100%);
      touch-action: none;
    }

    /* =====================================================================
       GENEL ARAYÜZ ANİMASYONLARI
       ===================================================================== */
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes starPop {
      0% { transform: scale(0.3) rotate(-25deg); }
      65% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes boxCelebrate {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.06) rotate(-1.5deg); }
      70% { transform: scale(1.04) rotate(1.5deg); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-14px, 0, 0) rotate(-3deg); }
      40% { transform: translate3d(14px, 0, 0) rotate(3deg); }
      60% { transform: translate3d(-10px, 0, 0) rotate(-2deg); }
      80% { transform: translate3d(10px, 0, 0) rotate(2deg); }
    }

    @keyframes badgePop {
      0% { transform: scale(0.4); opacity: 0; }
      55% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes playBtnPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 0 #15803d, 0 18px 30px rgba(22, 163, 74, 0.38); }
      50% { transform: scale(1.035); box-shadow: 0 12px 0 #15803d, 0 22px 38px rgba(22, 163, 74, 0.55); }
    }

    /* =====================================================================
       40 HAREKETLİ SAHNE (GIF BENZERİ SÜREKLİ SVG DÖNGÜLERİ)
       ===================================================================== */
    @keyframes gifCutLine {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      45% { transform: translate(-44px, -6px) rotate(-6deg); }
      70% { transform: translate(-36px, 0px) rotate(-3deg); }
    }

    @keyframes gifLineRecoil {
      0%, 30%, 100% { transform: translateX(0px) rotate(0deg); }
      50%, 75% { transform: translateX(12px) rotate(5deg); }
    }

    @keyframes gifShove {
      0%, 100% { transform: translateX(0px); }
      45% { transform: translateX(24px); }
    }

    @keyframes gifFallBack {
      0%, 25%, 100% { transform: rotate(0deg) translateX(0px); }
      55%, 80% { transform: rotate(18deg) translateX(12px); }
    }

    @keyframes gifOffer {
      0%, 100% { transform: translateX(-8px) translateY(0px); }
      50% { transform: translateX(14px) translateY(-4px); }
    }

    @keyframes gifSnatch {
      0%, 100% { transform: translateX(-16px) rotate(-4deg); }
      50% { transform: translateX(22px) rotate(6deg); }
    }

    @keyframes gifPointLaugh {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(8px, -5px); }
      50% { transform: translate(2px, 0px); }
      75% { transform: translate(10px, -6px); }
    }

    @keyframes gifWave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }

    @keyframes gifWalkIn {
      0%, 100% { transform: translateX(10px); }
      50% { transform: translateX(-14px); }
    }

    @keyframes gifLiftUp {
      0%, 100% { transform: translateY(4px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes gifShoutWave {
      0%, 100% { transform: scale(0.85); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes gifScribble {
      0%, 100% { transform: translate(-10px, -4px); }
      33% { transform: translate(12px, 4px); }
      66% { transform: translate(-6px, 6px); }
    }

    @keyframes gifDoorSwing {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.45); }
    }

    @keyframes gifTossTrash {
      0% { transform: translate(0px, 0px) scale(1); opacity: 1; }
      65% { transform: translate(34px, 24px) scale(0.95); opacity: 1; }
      85%, 100% { transform: translate(38px, 42px) scale(0.75); opacity: 0; }
    }

    @keyframes gifDropTrash {
      0% { transform: translateY(-14px); opacity: 1; }
      70%, 100% { transform: translateY(34px); opacity: 1; }
    }

    @keyframes gifKick {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-28deg); }
    }

    @keyframes gifBlockFly {
      0%, 25% { transform: translate(0px, 0px) rotate(0deg); }
      65%, 90% { transform: translate(24px, -28px) rotate(40deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    @keyframes gifSwing {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }

    @keyframes gifRaiseHand {
      0%, 100% { transform: translateY(5px) rotate(4deg); }
      50% { transform: translateY(-8px) rotate(-5deg); }
    }

    @keyframes gifClap {
      0%, 100% { transform: scale(0.88); }
      50% { transform: scale(1.2); }
    }

    @keyframes gifTear {
      0% { transform: translateY(0px); opacity: 1; }
      80% { transform: translateY(15px); opacity: 0.2; }
      100% { transform: translateY(0px); opacity: 0; }
    }

    @keyframes gifHeart {
      0%, 100% { transform: translateY(0px) scale(0.95); }
      50% { transform: translateY(-7px) scale(1.1); }
    }

    @keyframes gifYankBag {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(18px); }
    }

    @keyframes gifRunDash {
      0%, 100% { transform: translateX(-18px); }
      50% { transform: translateX(18px); }
    }

    @keyframes gifTongue {
      0%, 100% { transform: rotate(-4deg) translateY(0px); }
      50% { transform: rotate(4deg) translateY(3px); }
    }

    @keyframes gifNod {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(4px); }
    }

    .anim-cut-line { animation: gifCutLine 1.5s ease-in-out infinite; }
    .anim-line-recoil { animation: gifLineRecoil 1.5s ease-in-out infinite; }
    .anim-shove { animation: gifShove 1.3s ease-in-out infinite; }
    .anim-fall-back { animation: gifFallBack 1.3s ease-in-out infinite; }
    .anim-offer { animation: gifOffer 1.5s ease-in-out infinite; }
    .anim-snatch { animation: gifSnatch 1.3s ease-in-out infinite; }
    .anim-point-laugh { animation: gifPointLaugh 1.1s ease-in-out infinite; }
    .anim-wave { transform-origin: 124px 134px; animation: gifWave 1.2s ease-in-out infinite; }
    .anim-walk-in { animation: gifWalkIn 1.8s ease-in-out infinite; }
    .anim-lift-up { animation: gifLiftUp 1.5s ease-in-out infinite; }
    .anim-shout-wave { transform-box: fill-box; transform-origin: center; animation: gifShoutWave 0.9s ease-in-out infinite; }
    .anim-scribble { animation: gifScribble 0.85s ease-in-out infinite; }
    .anim-door-swing { transform-box: fill-box; transform-origin: left center; animation: gifDoorSwing 1.4s ease-in-out infinite; }
    .anim-toss-trash { animation: gifTossTrash 1.6s ease-in-out infinite; }
    .anim-drop-trash { animation: gifDropTrash 1.5s ease-in-out infinite; }
    .anim-kick { transform-box: fill-box; transform-origin: top center; animation: gifKick 1.3s ease-in-out infinite; }
    .anim-block-fly { animation: gifBlockFly 1.3s ease-in-out infinite; }
    .anim-swing { transform-origin: 238px 22px; animation: gifSwing 1.8s ease-in-out infinite; }
    .anim-raise-hand { transform-origin: 206px 132px; animation: gifRaiseHand 1.3s ease-in-out infinite; }
    .anim-clap { transform-box: fill-box; transform-origin: center; animation: gifClap 0.75s ease-in-out infinite; }
    .anim-tear { animation: gifTear 1.3s ease-in infinite; }
    .anim-heart { transform-box: fill-box; transform-origin: center; animation: gifHeart 1.4s ease-in-out infinite; }
    .anim-yank-bag { animation: gifYankBag 1.2s ease-in-out infinite; }
    .anim-run-dash { animation: gifRunDash 1.4s ease-in-out infinite; }
    .anim-tongue { transform-box: fill-box; transform-origin: center; animation: gifTongue 1.1s ease-in-out infinite; }
    .anim-nod { animation: gifNod 1.4s ease-in-out infinite; }

    /* =====================================================================
       KART VE HEDEF KUTU ETKİLEŞİM STİLLERİ
       ===================================================================== */
    .card-idle {
      animation: floatSoft 3.2s ease-in-out infinite;
    }

    .card-selected {
      box-shadow: 0 0 0 6px #facc15, 0 20px 38px rgba(15, 23, 42, 0.22) !important;
    }

    .card-shake {
      animation: gentleShake 0.55s ease-in-out !important;
    }

    .badge-pop {
      animation: badgePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .star-filled {
      animation: starPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .box-celebrate {
      animation: boxCelebrate 0.6s ease-in-out;
    }

    .play-btn-hero {
      animation: playBtnPulse 2s ease-in-out infinite;
    }

    .play-btn-hero:active {
      transform: translateY(5px) scale(0.98) !important;
    }

    .target-box {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, filter 0.2s ease;
    }

    .target-box.hover-green {
      transform: scale(1.05) translateY(-4px);
      box-shadow: 0 0 0 7px #fde047, 0 20px 38px rgba(22, 163, 74, 0.55);
      filter: brightness(1.06);
    }

    .target-box.hover-red {
      transform: scale(1.05) translateY(-4px);
      box-shadow: 0 0 0 7px #fca5a5, 0 20px 38px rgba(220, 38, 38, 0.55);
      filter: brightness(1.06);
    }

    #behavior-card {
      touch-action: none;
      cursor: grab;
      will-change: transform;
    }

    #behavior-card.dragging {
      cursor: grabbing;
      animation: none !important;
      z-index: 45;
      box-shadow: 0 26px 48px rgba(15, 23, 42, 0.28);
    }

    #effects-layer {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      overflow: hidden;
    }

    .burst-particle {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease-out;
    }
  </style>
</head>
<body class="relative w-full h-[100dvh] select-none">

  <!-- YUMUŞAK SINIF DOSTU ARKA PLAN DEKORASYONU -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <div class="absolute -top-24 -left-24 w-72 h-72 rounded-full bg-sky-200/45 blur-2xl"></div>
    <div class="absolute -top-20 -right-20 w-72 h-72 rounded-full bg-emerald-200/45 blur-2xl"></div>
    <div class="absolute bottom-0 inset-x-0 h-14 bg-gradient-to-t from-emerald-200/50 to-transparent"></div>
  </div>

  <!-- EFEKTLER VE KONFETİ KATMANI -->
  <div id="effects-layer"></div>
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>

  <!-- =======================================================================
       ANA SİMETRİK OYUN DÜZENİ (Ortalanmış, Katmanlar Çakışmaz)
       ======================================================================= -->
  <div class="relative z-10 w-full max-w-5xl mx-auto h-[100dvh] flex flex-col items-center justify-between px-3 sm:px-6 py-2.5 sm:py-4">

    <!-- 1. ÜST ÇUBUK: BAŞLIK + 8 YILDIZLI İLERLEME + İPUCU & YENİDEN BAŞLAT -->
    <header class="w-full bg-white/90 backdrop-blur-md rounded-2xl sm:rounded-3xl px-3 sm:px-5 py-2 sm:py-2.5 shadow-sm border-2 border-sky-200 flex flex-wrap lg:flex-nowrap items-center justify-between gap-2 shrink-0 relative z-30">
      <!-- Sol: Oyun Başlığı ve Tur/Soru Göstergesi -->
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-xl sm:text-2xl leading-none">😊</span>
        <span class="font-black text-sky-950 text-sm sm:text-lg tracking-tight">Nezaket mi, Kabalık mı?</span>
        <span id="round-indicator" class="bg-sky-100 text-sky-800 border border-sky-300 font-extrabold text-xs px-2.5 py-0.5 rounded-full">
          Tur 1/5 • 1/8
        </span>
      </div>

      <!-- Orta: 8 Yıldızlı İlerleme Göstergesi -->
      <div id="stars-container" class="order-3 lg:order-2 w-full lg:w-auto flex items-center justify-center gap-1 sm:gap-1.5 bg-amber-50/90 px-3 py-1 rounded-full border border-amber-200">
        <!-- JS ile 8 yıldız yuvası doldurulur -->
      </div>

      <!-- Sağ: Öğretmen İpucu Aç/Kapat ve Yeniden Başlat Butonu -->
      <div class="order-2 lg:order-3 flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="btn-toggle-hint" type="button" title="Kart altındaki öğretmen açıklamasını göster/gizle"
          class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-xs rounded-full border border-slate-300 transition cursor-pointer">
          İpucu: Açık
        </button>

        <button id="btn-restart-top" type="button" title="Tüm 40 soruyu sıfırla ve baştan başla"
          class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-extrabold text-xs sm:text-sm rounded-full shadow-xs transition flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Yeniden Başlat</span>
        </button>
      </div>
    </header>

    <!-- 2. ORTA SAHNE: ORTALANMIŞ HAREKETLİ DAVRANIŞ KARTI -->
    <main class="flex-1 w-full flex items-center justify-center min-h-0 py-2 relative z-20">
      <!-- Doğru Cevap Onay Rozeti -->
      <div id="feedback-badge-correct" class="hidden fixed inset-0 z-50 pointer-events-none flex items-center justify-center">
        <div class="badge-pop w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-emerald-500 border-8 border-white shadow-2xl flex items-center justify-center">
          <svg class="w-16 h-16 sm:w-20 sm:h-20 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Ortalanmış Kart Çerçevesi -->
      <div class="w-full max-w-[360px] sm:max-w-[440px] flex items-center justify-center">
        <div id="behavior-card"
          class="card-idle relative w-full bg-white rounded-[2rem] p-2.5 sm:p-3.5 shadow-xl border-4 border-sky-300 flex flex-col items-center justify-between transition-colors">

          <!-- Yanlış Kutu Seçildiğinde Çıkan Tekrar Dene Rozeti -->
          <div id="feedback-badge-retry" class="hidden absolute -top-4 -right-4 z-30 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-orange-500 border-4 border-white shadow-lg flex items-center justify-center text-white badge-pop pointer-events-none">
            <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path>
            </svg>
          </div>

          <!-- Hareketli (GIF Benzeri) SVG İllüstrasyon Sahnesi -->
          <div id="card-illustration" class="w-full aspect-[16/10] rounded-2xl overflow-hidden bg-sky-50 border-2 border-slate-100 flex items-center justify-center pointer-events-none">
            <!-- Aktif senaryonun hareketli SVG sahnesi buraya yüklenir -->
          </div>

          <!-- Öğretmen İpucu Açıklaması (İsteğe bağlı açılıp kapatılabilir) -->
          <p id="card-label" class="mt-2 text-xs sm:text-sm font-bold text-slate-500 tracking-tight text-center pointer-events-none">
            Oyuncağını arkadaşıyla paylaşmak
          </p>
        </div>
      </div>
    </main>

    <!-- 3. ALT BÖLÜM: SİMETRİK, ORTALANMIŞ İKİ HEDEF KUTU (NEZAKET & KABALIK) -->
    <section class="w-full max-w-4xl mx-auto grid grid-cols-2 gap-4 sm:gap-8 pb-1 sm:pb-2 shrink-0 relative z-10">

      <!-- SOL KUTU: YEŞİL "NEZAKET" KUTUSU (Üstünde Büyük Gülücük) -->
      <div id="box-good" data-type="good" role="button" tabindex="0" aria-label="Nezaket - İyi Davranışlar"
        class="target-box relative rounded-[1.75rem] sm:rounded-[2.25rem] bg-gradient-to-b from-emerald-400 to-green-600 border-4 border-emerald-200 shadow-[0_8px_0_#15803d,0_14px_26px_rgba(22,163,74,0.32)] p-3 sm:p-4 flex flex-col items-center justify-between cursor-pointer overflow-hidden">

        <!-- Üstte Büyük Gülücük Yüz İkonu -->
        <div class="my-0.5 sm:my-1 flex items-center justify-center pointer-events-none">
          <div class="w-16 h-16 sm:w-22 sm:h-22 rounded-full bg-yellow-300 border-4 border-amber-500 shadow-md flex items-center justify-center">
            <svg viewBox="0 0 100 100" class="w-14 h-14 sm:w-18 sm:h-18">
              <circle cx="50" cy="50" r="44" fill="#fde047" />
              <!-- Mutlu Gözler -->
              <circle cx="35" cy="40" r="6" fill="#78350f" />
              <circle cx="65" cy="40" r="6" fill="#78350f" />
              <circle cx="37" cy="38" r="2.2" fill="#ffffff" />
              <circle cx="67" cy="38" r="2.2" fill="#ffffff" />
              <!-- Pembe Yanaklar -->
              <ellipse cx="23" cy="52" rx="7" ry="4" fill="#fb7185" opacity="0.65" />
              <ellipse cx="77" cy="52" rx="7" ry="4" fill="#fb7185" opacity="0.65" />
              <!-- Büyük Neşeli Gülümseme -->
              <path d="M 30 56 Q 50 80 70 56 Z" fill="#ffffff" stroke="#78350f" stroke-width="4" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <!-- Kutu Başlığı: NEZAKET -->
        <div class="w-full bg-white/95 rounded-2xl py-1.5 sm:py-2 px-3 text-center shadow-inner pointer-events-none mt-1.5">
          <span class="block text-green-700 font-black text-base sm:text-2xl tracking-wide">
            Nezaket
          </span>
        </div>
      </div>

      <!-- SAĞ KUTU: KIRMIZI "KABALIK" KUTUSU (Üstünde Büyük Somurtan Yüz) -->
      <div id="box-bad" data-type="bad" role="button" tabindex="0" aria-label="Kabalık - Kötü Davranışlar"
        class="target-box relative rounded-[1.75rem] sm:rounded-[2.25rem] bg-gradient-to-b from-rose-500 to-red-600 border-4 border-rose-200 shadow-[0_8px_0_#991b1b,0_14px_26px_rgba(220,38,38,0.32)] p-3 sm:p-4 flex flex-col items-center justify-between cursor-pointer overflow-hidden">

        <!-- Üstte Büyük Somurtan Yüz İkonu -->
        <div class="my-0.5 sm:my-1 flex items-center justify-center pointer-events-none">
          <div class="w-16 h-16 sm:w-22 sm:h-22 rounded-full bg-orange-200 border-4 border-red-800 shadow-md flex items-center justify-center">
            <svg viewBox="0 0 100 100" class="w-14 h-14 sm:w-18 sm:h-18">
              <circle cx="50" cy="50" r="44" fill="#fed7aa" />
              <!-- Çatık Somurtan Kaşlar -->
              <path d="M 24 31 L 42 38" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round" />
              <path d="M 76 31 L 58 38" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round" />
              <!-- Gözler -->
              <circle cx="35" cy="45" r="5.5" fill="#450a0a" />
              <circle cx="65" cy="45" r="5.5" fill="#450a0a" />
              <!-- Somurtan / Üzgün Ağız -->
              <path d="M 32 70 Q 50 53 68 70" fill="none" stroke="#7f1d1d" stroke-width="5.5" stroke-linecap="round" />
            </svg>
          </div>
        </div>

        <!-- Kutu Başlığı: KABALIK -->
        <div class="w-full bg-white/95 rounded-2xl py-1.5 sm:py-2 px-3 text-center shadow-inner pointer-events-none mt-1.5">
          <span class="block text-red-700 font-black text-base sm:text-2xl tracking-wide">
            Kabalık
          </span>
        </div>
      </div>

    </section>
  </div>

  <!-- =======================================================================
       BAŞLANGIÇ EKRANI (Tamamen Sessiz, Büyük Gülücük & Somurtan Yüz İkonlu)
       ======================================================================= -->
  <div id="start-screen" class="fixed inset-0 z-40 bg-gradient-to-b from-sky-200/95 via-white/95 to-emerald-100/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div class="flex items-center justify-center gap-6 sm:gap-10 mb-5">
      <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full bg-yellow-300 border-4 border-amber-500 shadow-lg flex items-center justify-center text-5xl sm:text-6xl animate-bounce">

    /**
     * OYUN MOTORU:
     * - Her turda oynanmamış havuzdan rastgele 4 Nezaket + 4 Kabalık sorusu seçer ve karıştırır.
     * - "Yeniden Başlat" tuşuna basıldığında tüm zamanlayıcıları ve sürükleme kilidini anında sıfırlar.
     */
    const GameApp = (() => {
      const CARDS_PER_ROUND = 8;
      const TOTAL_ROUNDS = 5;

      let usedScenarioIds = new Set();
      let currentRound = 1;
      let deck = [];
      let currentIndex = 0;
      let isCardSelected = false;
      let isAnimating = false;
      let showTeacherHint = true;

      // Aktif zamanlayıcıları takip et (Yeniden Başlat basıldığında hepsi iptal edilir)
      let activeTimers = [];
      let confettiFrameId = null;

      // Pointer Sürükleme Durumu
      let activePointerId = null;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let lastPointerX = 0;
      let lastPointerY = 0;

      // DOM Elemanları
      const startScreen = document.getElementById('start-screen');
      const victoryScreen = document.getElementById('victory-screen');
      const roundIndicator = document.getElementById('round-indicator');
      const starsContainer = document.getElementById('stars-container');
      const cardEl = document.getElementById('behavior-card');
      const cardIllusEl = document.getElementById('card-illustration');
      const cardLabelEl = document.getElementById('card-label');
      const boxGood = document.getElementById('box-good');
      const boxBad = document.getElementById('box-bad');
      const correctBadge = document.getElementById('feedback-badge-correct');
      const retryBadge = document.getElementById('feedback-badge-retry');
      const effectsLayer = document.getElementById('effects-layer');
      const btnToggleHint = document.getElementById('btn-toggle-hint');

      const victoryTitle = document.getElementById('victory-title');
      const victorySubtitle = document.getElementById('victory-subtitle');
      const btnNextRound = document.getElementById('btn-next-round');
      const btnNextRoundLabel = document.getElementById('btn-next-round-label');
      const btnResetAllLabel = document.getElementById('btn-reset-all-label');

      function scheduleTimer(callback, delay) {
        const id = setTimeout(() => {
          activeTimers = activeTimers.filter((t) => t !== id);
          callback();
        }, delay);
        activeTimers.push(id);
        return id;
      }

      function clearAllTimers() {
        activeTimers.forEach((id) => clearTimeout(id));
        activeTimers = [];
        if (confettiFrameId !== null) {
          cancelAnimationFrame(confettiFrameId);
          confettiFrameId = null;
        }
        const canvas = document.getElementById('confetti-canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.classList.add('hidden');
        }
      }

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function buildBalancedDeckForRound() {
        const unusedGood = shuffleArray(
          SCENARIOS.filter((s) => s.type === 'good' && !usedScenarioIds.has(s.id))
        );
        const unusedBad = shuffleArray(
          SCENARIOS.filter((s) => s.type === 'bad' && !usedScenarioIds.has(s.id))
        );

        const selectedGood = unusedGood.slice(0, 4);
        const selectedBad = unusedBad.slice(0, 4);
        const roundCards = shuffleArray([...selectedGood, ...selectedBad]);

        roundCards.forEach((card) => usedScenarioIds.add(card.id));
        return roundCards;
      }

      function updateRoundIndicator() {
        const cardNumber = Math.min(currentIndex + 1, CARDS_PER_ROUND);
        roundIndicator.textContent = `Tur ${currentRound}/${TOTAL_ROUNDS} • ${cardNumber}/${CARDS_PER_ROUND}`;
      }

      function renderStars() {
        starsContainer.innerHTML = '';
        for (let i = 0; i < CARDS_PER_ROUND; i++) {
          const isFilled = i < currentIndex;
          const starWrapper = document.createElement('div');
          starWrapper.className = `w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center rounded-full transition-all ${
            isFilled ? 'bg-amber-200 star-filled shadow-xs' : 'bg-white'
          }`;

          starWrapper.innerHTML = isFilled
            ? `<svg class="w-5 h-5 sm:w-6 sm:h-6 text-amber-500" viewBox="0 0 24 24" fill="currentColor" stroke="#b45309" stroke-width="1.5">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
               </svg>`
            : `<svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-300" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
               </svg>`;

          starsContainer.appendChild(starWrapper);
        }
        updateRoundIndicator();
      }

      function renderCurrentCard() {
        isCardSelected = false;
        isAnimating = false;
        activePointerId = null;

        cardEl.classList.remove(
          'dragging',
          'card-selected',
          'card-shake',
          'border-orange-400',
          'ring-4',
          'ring-orange-200',
          'opacity-0'
        );
        retryBadge.classList.add('hidden');
        resetCardPosition(false);

        const item = deck[currentIndex];
        if (!item) return;
        cardIllusEl.innerHTML = item.svg;
        cardLabelEl.textContent = item.title;
        cardLabelEl.classList.toggle('hidden', !showTeacherHint);
        updateRoundIndicator();
      }

      function resetCardPosition(animate = true) {
        currentX = 0;
        currentY = 0;
        cardEl.style.transition = animate
          ? 'transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1)'
          : 'none';
        cardEl.style.transform = 'translate3d(0px, 0px, 0px) scale(1) rotate(0deg)';
        clearBoxHighlights();
      }

      function clearBoxHighlights() {
        boxGood.classList.remove('hover-green');
        boxBad.classList.remove('hover-red');
      }

      function getHoveredBox(pointerX, pointerY) {
        const cardRect = cardEl.getBoundingClientRect();
        const cardCenterX = cardRect.left + cardRect.width / 2;
        const cardCenterY = cardRect.top + cardRect.height / 2;
        const pad = 24;

        function isInside(rect, x, y) {
          return (
            x >= rect.left - pad &&
            x <= rect.right + pad &&
            y >= rect.top - pad &&
            y <= rect.bottom + pad
          );
        }

        const goodRect = boxGood.getBoundingClientRect();
        const badRect = boxBad.getBoundingClientRect();

        if (isInside(goodRect, pointerX, pointerY) || isInside(goodRect, cardCenterX, cardCenterY)) {
          return 'good';
        }
        if (isInside(badRect, pointerX, pointerY) || isInside(badRect, cardCenterX, cardCenterY)) {
          return 'bad';
        }
        return null;
      }

      function spawnStarBurst(targetBox) {
        const rect = targetBox.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 3;
        const emojis = ['⭐', '🌟', '✨', '💖', '💚', '😊'];

        for (let i = 0; i < 14; i++) {
          const el = document.createElement('div');
          el.className = 'burst-particle';
          el.textContent = emojis[i % emojis.length];
          el.style.left = `${centerX}px`;
          el.style.top = `${centerY}px`;
          effectsLayer.appendChild(el);

          const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.4 - 0.2);
          const dist = 70 + Math.random() * 110;
          const tx = Math.cos(angle) * dist;
          const ty = Math.sin(angle) * dist - 40;

          requestAnimationFrame(() => {
            el.style.transform = `translate(${tx}px, ${ty}px) scale(${0.9 + Math.random() * 0.6}) rotate(${Math.random() * 360}deg)`;
            el.style.opacity = '0';
          });

          scheduleTimer(() => el.remove(), 850);
        }
      }

      function handleAnswer(chosenType) {
        if (isAnimating) return;
        const currentItem = deck[currentIndex];
        if (!currentItem) return;

        const targetBox = chosenType === 'good' ? boxGood : boxBad;
        clearBoxHighlights();
        isCardSelected = false;
        cardEl.classList.remove('card-selected');

        if (chosenType === currentItem.type) {
          isAnimating = true;

          targetBox.classList.add('box-celebrate');
          scheduleTimer(() => targetBox.classList.remove('box-celebrate'), 650);

          spawnStarBurst(targetBox);

          correctBadge.classList.remove('hidden');
          scheduleTimer(() => correctBadge.classList.add('hidden'), 650);

          const boxRect = targetBox.getBoundingClientRect();
          const cardRect = cardEl.getBoundingClientRect();
          const dx = (boxRect.left + boxRect.width / 2) - (cardRect.left + cardRect.width / 2);
          const dy = (boxRect.top + boxRect.height / 2) - (cardRect.top + cardRect.height / 2);

          cardEl.style.transition = 'transform 0.4s ease-in, opacity 0.36s ease-in';
          cardEl.style.transform = `translate3d(${currentX + dx}px, ${currentY + dy}px, 0) scale(0.15) rotate(${chosenType === 'good' ? -12 : 12}deg)`;
          cardEl.classList.add('opacity-0');

          currentIndex++;
          renderStars();

          scheduleTimer(() => {
            isAnimating = false;
            if (currentIndex >= deck.length) {
              showVictoryScreen();
            } else {
              renderCurrentCard();
            }
          }, 780);
        } else {
          isAnimating = true;
          resetCardPosition(true);

          cardEl.classList.add('border-orange-400', 'ring-4', 'ring-orange-200');
          retryBadge.classList.remove('hidden');

          cardEl.classList.remove('card-shake');
          void cardEl.offsetWidth;
          cardEl.classList.add('card-shake');

          scheduleTimer(() => {
            cardEl.classList.remove('card-shake', 'border-orange-400', 'ring-4', 'ring-orange-200');
            retryBadge.classList.add('hidden');
            isAnimating = false;
          }, 680);
        }
      }

      function setupInteractions() {
        cardEl.addEventListener('pointerdown', (e) => {
          if (isAnimating || activePointerId !== null) return;

          activePointerId = e.pointerId;
          startX = e.clientX - currentX;
          startY = e.clientY - currentY;
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;

          cardEl.classList.add('dragging');
          cardEl.style.transition = 'none';

          try {
            cardEl.setPointerCapture(e.pointerId);
          } catch (_) {}
        });

        window.addEventListener('pointermove', (e) => {
          if (activePointerId === null || e.pointerId !== activePointerId || isAnimating) return;

          currentX = e.clientX - startX;
          currentY = e.clientY - startY;
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;

          const rotateDeg = Math.max(-14, Math.min(14, currentX * 0.045));
          cardEl.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(1.03) rotate(${rotateDeg}deg)`;

          const hovered = getHoveredBox(lastPointerX, lastPointerY);
          clearBoxHighlights();
          if (hovered === 'good') boxGood.classList.add('hover-green');
          if (hovered === 'bad') boxBad.classList.add('hover-red');
        });

        function finishPointerDrag(e) {
          if (activePointerId === null || e.pointerId !== activePointerId) return;

          const pid = activePointerId;
          activePointerId = null;
          cardEl.classList.remove('dragging');

          try {
            if (cardEl.hasPointerCapture(pid)) {
              cardEl.releasePointerCapture(pid);
            }
          } catch (_) {}

          if (isAnimating) return;

          const moveDistance = Math.hypot(currentX, currentY);
          const hovered = getHoveredBox(lastPointerX, lastPointerY);

          if (hovered) {
            handleAnswer(hovered);
          } else if (moveDistance < 12) {
            resetCardPosition(true);
            isCardSelected = !isCardSelected;
            cardEl.classList.toggle('card-selected', isCardSelected);
          } else {
            resetCardPosition(true);
          }
        }

        window.addEventListener('pointerup', finishPointerDrag);
        window.addEventListener('pointercancel', finishPointerDrag);

        boxGood.addEventListener('click', () => {
          if (!isAnimating) handleAnswer('good');
        });

        boxBad.addEventListener('click', () => {
          if (!isAnimating) handleAnswer('bad');
        });

        // Öğretmen İpucu Aç/Kapat
        btnToggleHint.addEventListener('click', () => {
          showTeacherHint = !showTeacherHint;
          btnToggleHint.textContent = showTeacherHint ? 'İpucu: Açık' : 'İpucu: Kapalı';
          cardLabelEl.classList.toggle('hidden', !showTeacherHint);
        });

        // Üst Çubuktaki Yeniden Başlat Butonu (Tüm zamanlayıcıları temizleyip 1. turdan sıfırlar)
        document.getElementById('btn-restart-top').addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          resetAllAndStart();
        });
      }

      function showVictoryScreen() {
        const remainingQuestions = SCENARIOS.length - usedScenarioIds.size;
        const hasMoreRounds = remainingQuestions >= CARDS_PER_ROUND && currentRound < TOTAL_ROUNDS;

        if (hasMoreRounds) {
          victoryTitle.textContent = 'Harika! Nezaket Kahramanı Oldun!';
          victorySubtitle.textContent = `Tur ${currentRound}/${TOTAL_ROUNDS} Tamamlandı • ${remainingQuestions} Yeni Soru Kaldı`;
          btnNextRound.classList.remove('hidden');
          btnNextRoundLabel.textContent = `Yeni Sorularla Oyna (Tur ${currentRound + 1}/${TOTAL_ROUNDS})`;
          btnResetAllLabel.textContent = 'Baştan Başla';
        } else {
          victoryTitle.textContent = 'Tebrikler! Tüm 40 Soru Tamamlandı!';
          victorySubtitle.textContent = '5 Turun Tamamını Başarıyla Bitirdin! 🏆';
          btnNextRound.classList.add('hidden');
          btnResetAllLabel.textContent = 'Baştan Başla (40 Soruyu Sıfırla)';
        }

        victoryScreen.classList.remove('hidden');
        launchConfetti();
      }

      function launchConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#facc15', '#22c55e', '#3b82f6', '#f43f5e', '#a855f7', '#fb923c'];
        const pieces = Array.from({ length: 110 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height,
          w: 10 + Math.random() * 10,
          h: 6 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: 2.5 + Math.random() * 4,
          vx: -2 + Math.random() * 4,
          rot: Math.random() * 360,
          vRot: -6 + Math.random() * 12
        }));

        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let active = false;

          pieces.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vRot;
            if (p.y < canvas.height + 30) active = true;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });

          if (active && !victoryScreen.classList.contains('hidden')) {
            confettiFrameId = requestAnimationFrame(render);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.classList.add('hidden');
            confettiFrameId = null;
          }
        }
        render();
      }

      function startNextRound() {
        clearAllTimers();
        if (usedScenarioIds.size >= SCENARIOS.length) {
          resetAllAndStart();
          return;
        }
        currentRound++;
        startRoundInternal();
      }

      function resetAllAndStart() {
        clearAllTimers();
        if (activePointerId !== null) {
          try {
            if (cardEl.hasPointerCapture(activePointerId)) {
              cardEl.releasePointerCapture(activePointerId);
            }
          } catch (_) {}
          activePointerId = null;
        }
        usedScenarioIds.clear();
        currentRound = 1;
        effectsLayer.innerHTML = '';
        startRoundInternal();
      }

      function startRoundInternal() {
        isAnimating = false;
        isCardSelected = false;
        activePointerId = null;

        victoryScreen.classList.add('hidden');
        startScreen.classList.add('hidden');
        correctBadge.classList.add('hidden');
        retryBadge.classList.add('hidden');
        boxGood.classList.remove('box-celebrate', 'hover-green');
        boxBad.classList.remove('box-celebrate', 'hover-red');

        deck = buildBalancedDeckForRound();
        currentIndex = 0;
        renderStars();
        renderCurrentCard();
      }

      function init() {
        renderStars();
        setupInteractions();

        document.getElementById('btn-start-game').addEventListener('click', () => {
          resetAllAndStart();
        });

        btnNextRound.addEventListener('click', () => {
          startNextRound();
        });

        document.getElementById('btn-reset-all').addEventListener('click', () => {
          resetAllAndStart();
        });
      }

      return { init };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      GameApp.init();
    });
  </script>
</body>
