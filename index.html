<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Güneş mi, Bulut mu? - Akran Nezaketi Oyunu</title>
  <!-- Çocuk dostu, yuvarlak hatlı ve Türkçe karakter destekli fontlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-display: 'Fredoka', 'Nunito', sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-display);
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 45%, #fef9c3 85%, #dcfce7 100%);
      touch-action: none;
    }

    /* Arka Plan ve Kutu Animasyonları */
    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes floatCloud {
      0%, 100% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(14px) translateY(-5px); }
    }

    @keyframes grumpyBob {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(5px) rotate(1.5deg); }
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes starPop {
      0% { transform: scale(0.3) rotate(-30deg); }
      60% { transform: scale(1.35) rotate(12deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes boxCelebrate {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.09) rotate(-2deg); }
      70% { transform: scale(1.05) rotate(2deg); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      18% { transform: translate3d(-14px, 0, 0) rotate(-3deg); }
      36% { transform: translate3d(14px, 0, 0) rotate(3deg); }
      54% { transform: translate3d(-10px, 0, 0) rotate(-2deg); }
      72% { transform: translate3d(10px, 0, 0) rotate(2deg); }
    }

    @keyframes badgePop {
      0% { transform: scale(0.4); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes playBtnPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 0 #15803d, 0 20px 35px rgba(22, 163, 74, 0.45); }
      50% { transform: scale(1.04); box-shadow: 0 14px 0 #15803d, 0 25px 45px rgba(22, 163, 74, 0.65); }
    }

    .sun-rays {
      transform-origin: center;
      animation: spinSlow 28s linear infinite;
    }

    .cloud-drift {
      animation: floatCloud 6s ease-in-out infinite;
    }

    .grumpy-cloud {
      animation: grumpyBob 4.5s ease-in-out infinite;
    }

    .card-idle {
      animation: cardFloat 3.4s ease-in-out infinite;
    }

    .card-selected {
      box-shadow: 0 0 0 6px #facc15, 0 22px 40px rgba(0, 0, 0, 0.22) !important;
    }

    .card-shake {
      animation: gentleShake 0.55s ease-in-out !important;
    }

    .badge-pop {
      animation: badgePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .star-filled {
      animation: starPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .box-celebrate {
      animation: boxCelebrate 0.6s ease-in-out;
    }

    .play-btn-hero {
      animation: playBtnPulse 2s ease-in-out infinite;
    }

    .play-btn-hero:active {
      transform: translateY(6px) scale(0.98) !important;
      box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(22, 163, 74, 0.4) !important;
    }

    /* Hedef Kutuların Vurgu Efektleri */
    .target-box {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, filter 0.2s ease;
    }

    .target-box.hover-green {
      transform: scale(1.07) translateY(-6px);
      box-shadow: 0 0 0 8px #fde047, 0 22px 42px rgba(22, 163, 74, 0.6);
      filter: brightness(1.07);
    }

    .target-box.hover-red {
      transform: scale(1.07) translateY(-6px);
      box-shadow: 0 0 0 8px #fca5a5, 0 22px 42px rgba(220, 38, 38, 0.6);
      filter: brightness(1.07);
    }

    /* Sürüklenebilir Kart Stili */
    #behavior-card {
      touch-action: none;
      cursor: grab;
      will-change: transform;
    }

    #behavior-card.dragging {
      cursor: grabbing;
      animation: none !important;
      z-index: 50;
      box-shadow: 0 28px 50px rgba(15, 23, 42, 0.32);
    }

    /* Parçacık ve Konfeti Katmanı */
    #effects-layer {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      overflow: hidden;
    }

    .burst-particle {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s ease-out;
    }
  </style>
</head>
<body class="relative w-full h-[100dvh] select-none">

  <!-- ARKA PLAN DEKORASYONU (Sol Üst Güneş, Sağ Üst Bulut ve Süzülen Bulutlar) -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <!-- Sol Üst Gülen Güneş -->
    <div class="absolute -top-6 -left-6 sm:-top-4 sm:-left-4 w-28 h-28 sm:w-40 sm:h-40 opacity-95">
      <svg viewBox="0 0 160 160" class="w-full h-full overflow-visible">
        <g class="sun-rays">
          <circle cx="80" cy="80" r="68" fill="none" stroke="#facc15" stroke-width="10" stroke-dasharray="14 14" stroke-linecap="round" />
        </g>
        <circle cx="80" cy="80" r="46" fill="#fde047" stroke="#f59e0b" stroke-width="4" />
        <!-- Güneş Yüzü -->
        <circle cx="65" cy="73" r="5" fill="#78350f" />
        <circle cx="95" cy="73" r="5" fill="#78350f" />
        <circle cx="67" cy="71" r="1.8" fill="#ffffff" />
        <circle cx="97" cy="71" r="1.8" fill="#ffffff" />
        <ellipse cx="56" cy="83" rx="6" ry="3.5" fill="#fb923c" opacity="0.65" />
        <ellipse cx="104" cy="83" rx="6" ry="3.5" fill="#fb923c" opacity="0.65" />
        <path d="M 65 88 Q 80 103 95 88" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Sağ Üst Somurtkan Yağmur Bulutu -->
    <div class="absolute top-12 -right-4 sm:top-10 sm:right-2 w-28 h-24 sm:w-40 sm:h-32 grumpy-cloud opacity-90">
      <svg viewBox="0 0 180 140" class="w-full h-full overflow-visible">
        <!-- Yağmur Damlaları -->
        <path d="M55 108 L50 122" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
        <path d="M90 112 L85 126" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
        <path d="M125 108 L120 122" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
        <!-- Bulut Gövdesi -->
        <path d="M45 98 H135 C152 98 164 86 164 70 C164 55 152 44 138 43 C133 24 115 12 94 12 C75 12 59 23 53 39 C35 41 22 55 22 72 C22 87 32 98 45 98 Z" fill="#94a3b8" stroke="#64748b" stroke-width="4" />
        <!-- Çatık Kaşlar ve Üzgün Ağız -->
        <path d="M68 55 L82 61" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
        <path d="M112 55 L98 61" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
        <circle cx="75" cy="67" r="4.5" fill="#1e293b" />
        <circle cx="105" cy="67" r="4.5" fill="#1e293b" />
        <path d="M76 86 Q 90 75 104 86" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Dekoratif Beyaz Bulutlar -->
    <div class="hidden md:block absolute top-24 left-44 w-32 h-16 cloud-drift opacity-75">
      <svg viewBox="0 0 140 70" class="w-full h-full">
        <path d="M25 58 H115 C127 58 135 49 135 38 C135 28 127 20 117 19 C112 8 100 2 86 2 C72 2 60 9 56 20 C42 21 32 31 32 43 C32 52 16 58 25 58 Z" fill="#ffffff" />
      </svg>
    </div>

    <!-- Alt Çimen Şeridi -->
    <div class="absolute bottom-0 inset-x-0 h-8 sm:h-12 bg-gradient-to-t from-green-300/60 to-transparent"></div>
  </div>

  <!-- EFEKTLER VE KONFETİ KATMANI -->
  <div id="effects-layer"></div>
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>

  <!-- ANA UYGULAMA KONTEYNERİ (100dvh, kaydırmasız) -->
  <div id="app" class="relative z-10 w-full h-[100dvh] flex flex-col justify-between items-center px-3 py-2 sm:px-6 sm:py-3 max-w-5xl mx-auto">

    <!-- 1. ÜST BAŞLIK, 8 YILDIZLI İLERLEME ÇUBUĞU VE YENİDEN BAŞLAT BUTONU -->
    <header class="w-full flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 pt-0.5">
      <!-- Sol: Güneş ve Bulut İkonlu Oyun Başlığı -->
      <div class="flex items-center gap-1.5 bg-white/85 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-sm border-2 border-sky-200 shrink-0">
        <span class="text-lg sm:text-2xl leading-none">☀️</span>
        <span class="font-black text-sky-900 text-xs sm:text-base tracking-tight">Güneş mi, Bulut mu?</span>
        <span class="text-lg sm:text-2xl leading-none">🌧️</span>
      </div>

      <!-- Orta: 8 Büyük Yıldızlı İlerleme Çubuğu -->
      <div id="stars-container" class="order-3 sm:order-2 w-full sm:w-auto flex items-center justify-center gap-1 sm:gap-2 bg-white/90 backdrop-blur-sm px-3 py-1.5 sm:px-4 sm:py-2 rounded-full shadow-md border-2 border-amber-200">
        <!-- JS ile 8 yıldız yuvası doldurulacak -->
      </div>

      <!-- Sağ: Küçük Yeniden Başlat Butonu -->
      <button id="btn-restart-top" type="button" title="Yeniden Başlat" aria-label="Yeniden Başlat"
        class="order-2 sm:order-3 px-3 py-1.5 sm:px-3.5 sm:py-2 bg-white/90 hover:bg-sky-50 active:scale-95 text-sky-700 font-extrabold text-xs sm:text-sm rounded-full shadow-sm border-2 border-sky-200 transition flex items-center gap-1.5 shrink-0 cursor-pointer">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Yeniden Başlat</span>
      </button>
    </header>

    <!-- 2. ORTA KART ALANI (Sürüklenecek veya Dokunulacak Davranış Kartı) -->
    <main class="flex-1 w-full flex flex-col items-center justify-center my-1 relative min-h-0">

      <!-- Görsel Geri Bildirim Rozetleri (Doğru Onay / Tekrar Dene Oku) -->
      <div id="feedback-badge-correct" class="hidden fixed inset-0 z-50 pointer-events-none flex items-center justify-center">
        <div class="badge-pop w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-emerald-500 border-8 border-white shadow-2xl flex items-center justify-center">
          <svg class="w-16 h-16 sm:w-20 sm:h-20 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Sürüklenecek Davranış Kartı -->
      <div id="behavior-card"
        class="card-idle relative w-[86vw] max-w-[350px] sm:max-w-[430px] bg-white rounded-[2rem] p-2.5 sm:p-3.5 shadow-xl border-4 border-sky-300 flex flex-col items-center justify-between transition-colors">

        <!-- Yanlış Kutu Seçildiğinde Çıkan "Tekrar Dene" Kıvrımlı Ok Rozeti -->
        <div id="feedback-badge-retry" class="hidden absolute -top-5 -right-5 z-30 w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-orange-500 border-4 border-white shadow-lg flex items-center justify-center text-white badge-pop pointer-events-none">
          <svg class="w-8 h-8 sm:w-9 sm:h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14 4 9l5-5"></path>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path>
          </svg>
        </div>

        <!-- SVG İllüstrasyon Sahnesi -->
        <div id="card-illustration" class="w-full aspect-[16/10] rounded-2xl overflow-hidden bg-sky-50 border-2 border-slate-100 flex items-center justify-center pointer-events-none">
          <!-- Aktif senaryonun özel çizgi film SVG sahnesi buraya yerleşir -->
        </div>

        <!-- Öğretmen İçin Kartın Alt Kenarında Küçük, İnce Referans Açıklaması -->
        <p id="card-label" class="mt-1.5 text-[11px] sm:text-xs font-semibold text-slate-400 tracking-tight text-center pointer-events-none">
          Oyuncağını paylaşmak
        </p>
      </div>
    </main>

    <!-- 3. ALT KISIM - İKİ DEV HEDEF KUTU (NEZAKET KUTUSU & KABA KUTUSU) -->
    <section class="w-full grid grid-cols-2 gap-3 sm:gap-6 pb-1 sm:pb-2 max-w-3xl shrink-0">

      <!-- SOL KUTU: YEŞİL NEZAKET KUTUSU -->
      <div id="box-good" data-type="good" role="button" tabindex="0" aria-label="Nezaket Kutusu - İyi Davranışlar"
        class="target-box relative rounded-[1.75rem] sm:rounded-[2.25rem] bg-gradient-to-b from-emerald-400 to-green-600 border-4 border-emerald-200 shadow-[0_8px_0_#15803d,0_14px_24px_rgba(22,163,74,0.35)] p-2.5 sm:p-4 flex flex-col items-center justify-between cursor-pointer overflow-hidden">

        <!-- Üst Simgeler: Gülen Güneş + Yeşil Kalp + Onay İşareti (✓) -->
        <div class="w-full flex items-center justify-between px-1 sm:px-2 pointer-events-none">
          <!-- Büyük Gülen Güneş İkonu -->
          <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-yellow-300 border-3 border-amber-500 flex items-center justify-center shadow-md">
            <svg viewBox="0 0 64 64" class="w-9 h-9 sm:w-11 sm:h-11">
              <circle cx="32" cy="32" r="18" fill="#fde047" stroke="#d97706" stroke-width="3" />
              <path d="M32 4 V10 M32 54 V60 M4 32 H10 M54 32 H60 M12 12 L16 16 M48 48 L52 52 M52 12 L48 16 M16 48 L12 52" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
              <circle cx="26" cy="29" r="2.5" fill="#78350f" />
              <circle cx="38" cy="29" r="2.5" fill="#78350f" />
              <path d="M25 36 Q32 43 39 36" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
            </svg>
          </div>

          <!-- Yeşil Kalp & Beyaz Onay İşareti -->
          <div class="flex items-center gap-1.5 sm:gap-2 bg-white/25 px-2.5 py-1 rounded-full">
            <span class="text-xl sm:text-2xl leading-none">💚</span>
            <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white text-green-600 flex items-center justify-center font-black text-base sm:text-xl shadow-sm">
              ✓
            </span>
          </div>
        </div>

        <!-- Kutu Yüzü (Gülümseyen Sevimli Kutu İfadesi) -->
        <div class="my-0.5 sm:my-1.5 flex flex-col items-center pointer-events-none">
          <svg class="w-20 h-11 sm:w-28 sm:h-15" viewBox="0 0 120 70">
            <circle cx="38" cy="24" r="7" fill="#064e3b" />
            <circle cx="82" cy="24" r="7" fill="#064e3b" />
            <circle cx="40" cy="21" r="2.5" fill="#ffffff" />
            <circle cx="84" cy="21" r="2.5" fill="#ffffff" />
            <ellipse cx="24" cy="36" rx="8" ry="4.5" fill="#fda4af" opacity="0.85" />
            <ellipse cx="96" cy="36" rx="8" ry="4.5" fill="#fda4af" opacity="0.85" />
            <path d="M 38 38 Q 60 62 82 38 Z" fill="#fef08a" stroke="#064e3b" stroke-width="4" stroke-linejoin="round" />
          </svg>
        </div>

        <!-- Kutu Başlığı -->
        <div class="w-full bg-white/95 rounded-2xl py-1 sm:py-1.5 px-2 text-center shadow-inner pointer-events-none">
          <span class="block text-green-700 font-black text-sm sm:text-xl tracking-wide">
            NEZAKET KUTUSU
          </span>
        </div>
      </div>

      <!-- SAĞ KUTU: KIRMIZI KABA KUTUSU -->
      <div id="box-bad" data-type="bad" role="button" tabindex="0" aria-label="Kaba Kutusu - Kötü Davranışlar"
        class="target-box relative rounded-[1.75rem] sm:rounded-[2.25rem] bg-gradient-to-b from-rose-500 to-red-600 border-4 border-rose-200 shadow-[0_8px_0_#991b1b,0_14px_24px_rgba(220,38,38,0.35)] p-2.5 sm:p-4 flex flex-col items-center justify-between cursor-pointer overflow-hidden">

        <!-- Üst Simgeler: Kaşları Çatık Yağmur Bulutu + Çarpı İşareti (✕) -->
        <div class="w-full flex items-center justify-between px-1 sm:px-2 pointer-events-none">
          <!-- Büyük Somurtkan Fırtına Bulutu İkonu -->
          <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-slate-200 border-3 border-slate-500 flex items-center justify-center shadow-md">
            <svg viewBox="0 0 64 64" class="w-9 h-9 sm:w-11 sm:h-11">
              <path d="M16 44 H48 C54 44 58 40 58 34 C58 29 54 25 49 25 C47 18 41 13 33 13 C26 13 20 17 18 23 C12 24 8 29 8 35 C8 40 11 44 16 44 Z" fill="#94a3b8" stroke="#475569" stroke-width="3" />
              <path d="M23 27 L29 30 M41 27 L35 30" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="26" cy="33" r="2" fill="#1e293b" />
              <circle cx="38" cy="33" r="2" fill="#1e293b" />
              <path d="M26 40 Q32 35 38 40" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
              <path d="M22 48 L20 54 M32 49 L30 55 M42 48 L40 54" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>

          <!-- Çarpı İşareti -->
          <div class="flex items-center gap-1.5 bg-white/25 px-2.5 py-1 rounded-full">
            <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white text-red-600 flex items-center justify-center font-black text-base sm:text-xl shadow-sm">
              ✕
            </span>
          </div>
        </div>

        <!-- Kutu Yüzü (Üzgün / Kaşları Çatık Kutu İfadesi) -->
        <div class="my-0.5 sm:my-1.5 flex flex-col items-center pointer-events-none">
          <svg class="w-20 h-11 sm:w-28 sm:h-15" viewBox="0 0 120 70">
            <path d="M 27 14 L 47 22" stroke="#450a0a" stroke-width="4.5" stroke-linecap="round" />
            <path d="M 93 14 L 73 22" stroke="#450a0a" stroke-width="4.5" stroke-linecap="round" />
            <circle cx="38" cy="28" r="6.5" fill="#450a0a" />
            <circle cx="82" cy="28" r="6.5" fill="#450a0a" />
            <circle cx="40" cy="26" r="2" fill="#ffffff" />
            <circle cx="84" cy="26" r="2" fill="#ffffff" />
            <path d="M 40 52 Q 60 35 80 52" fill="none" stroke="#450a0a" stroke-width="5" stroke-linecap="round" />
          </svg>
        </div>

        <!-- Kutu Başlığı -->
        <div class="w-full bg-white/95 rounded-2xl py-1 sm:py-1.5 px-2 text-center shadow-inner pointer-events-none">
          <span class="block text-red-700 font-black text-sm sm:text-xl tracking-wide">
            KABA KUTUSU
          </span>
        </div>
      </div>

    </section>
  </div>

  <!-- ========================================================= -->
  <!-- BAŞLANGIÇ EKRANI (Tam Ekran Kaplama, Tamamen Sessiz) -->
  <!-- ========================================================= -->
  <div id="start-screen" class="fixed inset-0 z-40 bg-gradient-to-b from-sky-300/95 via-sky-100/95 to-amber-100/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <!-- Maskot İkonları -->
    <div class="flex items-center justify-center gap-5 sm:gap-8 mb-5">
      <div class="w-22 h-22 sm:w-28 sm:h-28 bg-yellow-300 rounded-full border-4 border-amber-400 shadow-lg flex items-center justify-center text-5xl sm:text-6xl animate-bounce">
        ☀️
      </div>
      <div class="w-22 h-22 sm:w-28 sm:h-28 bg-slate-200 rounded-full border-4 border-slate-400 shadow-lg flex items-center justify-center text-5xl sm:text-6xl grumpy-cloud">
        🌧️
      </div>
    </div>

    <!-- Oyun Başlığı -->
    <h1 class="text-4xl sm:text-6xl font-black text-sky-900 drop-shadow-sm tracking-tight mb-2">
      Güneş mi, Bulut mu?
    </h1>
    <p class="text-lg sm:text-2xl font-extrabold text-emerald-700 bg-white/85 px-6 py-1.5 rounded-full border-2 border-emerald-300 mb-9 shadow-sm">
      Akran Nezaketi Oyunu
    </p>

    <!-- Dev Parlayan Yeşil OYNA Butonu -->

            <!-- Eşyayı Sertçe Çeken Çocuk (Sağ) -->
            <circle cx="268" cy="88" r="30" fill="#fed7aa" stroke="#9a3412" stroke-width="3" />
            <path d="M238 82 Q268 52 298 82 Z" fill="#1e293b" />
            <path d="M254 78 L266 84 M282 78 L270 84" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
            <circle cx="260" cy="89" r="3.8" fill="#1e293b" />
            <circle cx="276" cy="89" r="3.8" fill="#1e293b" />
            <path d="M258 105 Q268 97 278 105" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />
            <path d="M240 188 L248 126 L288 126 L296 188 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
            <path d="M246 140 L196 140" stroke="#fed7aa" stroke-width="12" stroke-linecap="round" />
            <!-- Ortada Çekiştirilen Renkli Defter / Kitap -->
            <rect x="155" y="122" width="44" height="36" rx="4" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5" />
            <line x1="177" y1="122" x2="177" y2="158" stroke="#93c5fd" stroke-width="2.5" />
            <path d="M206 125 L220 125 M208 152 L222 152" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
          </svg>
        `
      }
    ];

    /**
     * 2. OYUN KONTROLCÜSÜ (Tamamen Sessiz, Kesintisiz Sürükle-Bırak ve Dokunma Desteği)
     */
    const GameApp = (() => {
      let deck = [];
      let currentIndex = 0;
      let isCardSelected = false;
      let isAnimating = false;

      // Pointer Sürükleme Durumu
      let activePointerId = null;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let lastPointerX = 0;
      let lastPointerY = 0;

      // DOM Elemanları
      const startScreen = document.getElementById('start-screen');
      const victoryScreen = document.getElementById('victory-screen');
      const starsContainer = document.getElementById('stars-container');
      const cardEl = document.getElementById('behavior-card');
      const cardIllusEl = document.getElementById('card-illustration');
      const cardLabelEl = document.getElementById('card-label');
      const boxGood = document.getElementById('box-good');
      const boxBad = document.getElementById('box-bad');
      const correctBadge = document.getElementById('feedback-badge-correct');
      const retryBadge = document.getElementById('feedback-badge-retry');
      const effectsLayer = document.getElementById('effects-layer');

      // Fisher-Yates Karıştırma
      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // Üstteki 8 Yıldızlı İlerleme Çubuğunu Güncelle
      function renderStars() {
        starsContainer.innerHTML = '';
        for (let i = 0; i < SCENARIOS.length; i++) {
          const isFilled = i < currentIndex;
          const starWrapper = document.createElement('div');
          starWrapper.className = `w-7 h-7 sm:w-9 sm:h-9 flex items-center justify-center rounded-full transition-all ${
            isFilled ? 'bg-amber-100 star-filled shadow-xs' : 'bg-slate-100'
          }`;

          starWrapper.innerHTML = isFilled
            ? `<svg class="w-6 h-6 sm:w-7 sm:h-7 text-amber-400 drop-shadow" viewBox="0 0 24 24" fill="currentColor" stroke="#d97706" stroke-width="1.5">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
               </svg>`
            : `<svg class="w-5 h-5 sm:w-6 sm:h-6 text-slate-300" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
               </svg>`;

          starsContainer.appendChild(starWrapper);
        }
      }

      // Mevcut Kartı Ekrana Getir
      function renderCurrentCard() {
        isCardSelected = false;
        isAnimating = false;
        activePointerId = null;

        cardEl.classList.remove('card-selected', 'card-shake', 'border-orange-400', 'ring-4', 'ring-orange-200', 'opacity-0');
        retryBadge.classList.add('hidden');
        resetCardPosition(false);

        const item = deck[currentIndex];
        if (!item) return;
        cardIllusEl.innerHTML = item.svg;
        cardLabelEl.textContent = item.title;
      }

      // Kart Pozisyonunu Merkeze Sıfırla
      function resetCardPosition(animate = true) {
        currentX = 0;
        currentY = 0;
        cardEl.style.transition = animate
          ? 'transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1)'
          : 'none';
        cardEl.style.transform = 'translate3d(0px, 0px, 0px) scale(1) rotate(0deg)';
        clearBoxHighlights();
      }

      function clearBoxHighlights() {
        boxGood.classList.remove('hover-green');
        boxBad.classList.remove('hover-red');
      }

      // Hem İşaretçi Konumu Hem Kart Merkezine Göre Kutu Çarpışma Kontrolü (25px toleranslı)
      function getHoveredBox(pointerX, pointerY) {
        const cardRect = cardEl.getBoundingClientRect();
        const cardCenterX = cardRect.left + cardRect.width / 2;
        const cardCenterY = cardRect.top + cardRect.height / 2;
        const pad = 25;

        function isInside(rect, x, y) {
          return (
            x >= rect.left - pad &&
            x <= rect.right + pad &&
            y >= rect.top - pad &&
            y <= rect.bottom + pad
          );
        }

        const goodRect = boxGood.getBoundingClientRect();
        const badRect = boxBad.getBoundingClientRect();

        if (isInside(goodRect, pointerX, pointerY) || isInside(goodRect, cardCenterX, cardCenterY)) {
          return 'good';
        }
        if (isInside(badRect, pointerX, pointerY) || isInside(badRect, cardCenterX, cardCenterY)) {
          return 'bad';
        }
        return null;
      }

      // Kutudan Renkli Yıldızlar Fışkırtma Efekti
      function spawnStarBurst(targetBox) {
        const rect = targetBox.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 3;
        const emojis = ['⭐', '🌟', '✨', '💖', '💚', '☀️'];

        for (let i = 0; i < 14; i++) {
          const el = document.createElement('div');
          el.className = 'burst-particle';
          el.textContent = emojis[i % emojis.length];
          el.style.left = `${centerX}px`;
          el.style.top = `${centerY}px`;
          effectsLayer.appendChild(el);

          const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.4 - 0.2);
          const dist = 70 + Math.random() * 110;
          const tx = Math.cos(angle) * dist;
          const ty = Math.sin(angle) * dist - 40;

          requestAnimationFrame(() => {
            el.style.transform = `translate(${tx}px, ${ty}px) scale(${0.9 + Math.random() * 0.6}) rotate(${Math.random() * 360}deg)`;
            el.style.opacity = '0';
          });

          setTimeout(() => el.remove(), 900);
        }
      }

      // Cevabı Değerlendir (Kesinlikle takılmayan, zamanlayıcı korumalı akış)
      function handleAnswer(chosenType) {
        if (isAnimating) return;
        const currentItem = deck[currentIndex];
        if (!currentItem) return;

        const targetBox = chosenType === 'good' ? boxGood : boxBad;
        clearBoxHighlights();
        isCardSelected = false;
        cardEl.classList.remove('card-selected');

        if (chosenType === currentItem.type) {
          // DOĞRU KUTU!
          isAnimating = true;

          targetBox.classList.add('box-celebrate');
          setTimeout(() => targetBox.classList.remove('box-celebrate'), 650);

          spawnStarBurst(targetBox);

          // Büyük Yeşil Onay Rozetini Kısa Süreliğine Göster
          correctBadge.classList.remove('hidden');
          setTimeout(() => correctBadge.classList.add('hidden'), 650);

          // Kartı Kutu İçine Uçurarak Küçült
          const boxRect = targetBox.getBoundingClientRect();
          const cardRect = cardEl.getBoundingClientRect();
          const dx = (boxRect.left + boxRect.width / 2) - (cardRect.left + cardRect.width / 2);
          const dy = (boxRect.top + boxRect.height / 2) - (cardRect.top + cardRect.height / 2);

          cardEl.style.transition = 'transform 0.42s ease-in, opacity 0.38s ease-in';
          cardEl.style.transform = `translate3d(${currentX + dx}px, ${currentY + dy}px, 0) scale(0.15) rotate(${chosenType === 'good' ? -14 : 14}deg)`;
          cardEl.classList.add('opacity-0');

          // İlerlemeyi Artır ve Yıldızı Altın Yap
          currentIndex++;
          renderStars();

          // 850ms Sonra Kesin Olarak Bir Sonraki Karta veya Zafer Ekranına Geç
          setTimeout(() => {
            isAnimating = false;
            if (currentIndex >= deck.length) {
              showVictoryScreen();
            } else {
              renderCurrentCard();
            }
          }, 850);
        } else {
          // YANLIŞ KUTU - Yumuşak Yatay Titreme, Turuncu Çerçeve ve Tekrar Dene Oku
          isAnimating = true;
          resetCardPosition(true);

          cardEl.classList.add('border-orange-400', 'ring-4', 'ring-orange-200');
          retryBadge.classList.remove('hidden');

          cardEl.classList.remove('card-shake');
          void cardEl.offsetWidth;
          cardEl.classList.add('card-shake');

          setTimeout(() => {
            cardEl.classList.remove('card-shake', 'border-orange-400', 'ring-4', 'ring-orange-200');
            retryBadge.classList.add('hidden');
            isAnimating = false;
          }, 700);
        }
      }

      // Pointer Events ile Sürükle-Bırak ve Akıllı Tahta Dokunma Etkileşimleri
      function setupInteractions() {
        cardEl.addEventListener('pointerdown', (e) => {
          if (isAnimating || activePointerId !== null) return;

          activePointerId = e.pointerId;
          startX = e.clientX - currentX;
          startY = e.clientY - currentY;
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;

          cardEl.classList.add('dragging');
          cardEl.style.transition = 'none';

          try {
            cardEl.setPointerCapture(e.pointerId);
          } catch (_) {
            // Iframe veya bazı dokunmatik ekranlarda yakalama hatasını yoksay
          }
        });

        window.addEventListener('pointermove', (e) => {
          if (activePointerId === null || e.pointerId !== activePointerId || isAnimating) return;

          currentX = e.clientX - startX;
          currentY = e.clientY - startY;
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;

          const rotateDeg = Math.max(-14, Math.min(14, currentX * 0.045));
          cardEl.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(1.04) rotate(${rotateDeg}deg)`;

          const hovered = getHoveredBox(lastPointerX, lastPointerY);
          clearBoxHighlights();
          if (hovered === 'good') boxGood.classList.add('hover-green');
          if (hovered === 'bad') boxBad.classList.add('hover-red');
        });

        function finishPointerDrag(e) {
          if (activePointerId === null || e.pointerId !== activePointerId) return;

          const pid = activePointerId;
          activePointerId = null;
          cardEl.classList.remove('dragging');

          try {
            if (cardEl.hasPointerCapture(pid)) {
              cardEl.releasePointerCapture(pid);
            }
          } catch (_) {}

          if (isAnimating) return;

          const moveDistance = Math.hypot(currentX, currentY);
          const hovered = getHoveredBox(lastPointerX, lastPointerY);

          if (hovered) {
            handleAnswer(hovered);
          } else if (moveDistance < 12) {
            // Sürükleme değil, karta dokunma (seçim vurgusu)
            resetCardPosition(true);
            isCardSelected = !isCardSelected;
            cardEl.classList.toggle('card-selected', isCardSelected);
          } else {
            // Boş alana bırakıldıysa merkeze yaylanarak geri dön
            resetCardPosition(true);
          }
        }

        window.addEventListener('pointerup', finishPointerDrag);
        window.addEventListener('pointercancel', finishPointerDrag);

        // Kutulara Doğrudan Dokunma / Tıklama (Akıllı tahta ve tablet kolaylığı)
        boxGood.addEventListener('click', () => {
          if (!isAnimating) handleAnswer('good');
        });

        boxBad.addEventListener('click', () => {
          if (!isAnimating) handleAnswer('bad');
        });

        // Üstteki Yeniden Başlat Butonu
        document.getElementById('btn-restart-top').addEventListener('click', () => {
          startNewGame();
        });
      }

      // Zafer Ekranı ve Renkli Konfeti Animasyonu
      function showVictoryScreen() {
        victoryScreen.classList.remove('hidden');
        launchConfetti();
      }

      function launchConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#facc15', '#22c55e', '#3b82f6', '#f43f5e', '#a855f7', '#fb923c'];
        const pieces = Array.from({ length: 120 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height,
          w: 10 + Math.random() * 10,
          h: 6 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: 2.5 + Math.random() * 4,
          vx: -2 + Math.random() * 4,
          rot: Math.random() * 360,
          vRot: -6 + Math.random() * 12
        }));

        let animId;
        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let active = false;

          pieces.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vRot;
            if (p.y < canvas.height + 30) active = true;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });

          if (active && !victoryScreen.classList.contains('hidden')) {
            animId = requestAnimationFrame(render);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.classList.add('hidden');
            cancelAnimationFrame(animId);
          }
        }
        render();
      }

      // Yeni Oyun Başlat
      function startNewGame() {
        isAnimating = false;
        activePointerId = null;
        victoryScreen.classList.add('hidden');
        startScreen.classList.add('hidden');
        correctBadge.classList.add('hidden');
        retryBadge.classList.add('hidden');

        deck = shuffleArray(SCENARIOS);
        currentIndex = 0;
        renderStars();
        renderCurrentCard();
      }

      function init() {
        renderStars();
        setupInteractions();

        document.getElementById('btn-start-game').addEventListener('click', () => {
          startNewGame();
        });

        document.getElementById('btn-play-again').addEventListener('click', () => {
          startNewGame();
        });
      }

      return { init };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      GameApp.init();
    });
  </script>
